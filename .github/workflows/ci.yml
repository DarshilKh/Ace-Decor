##
## .github/workflows/ci.yml — ACE DÉCOR CI Pipeline
##
## Fully static site — no database, no admin panel, no third-party
## integrations. No GitHub Secrets are required to run this pipeline.
##
## Runs on every push to main and every pull request.
## Jobs (parallel where possible):
##   1. type-check — tsc --noEmit --skipLibCheck
##   2. lint       — eslint . --max-warnings=0
##   3. unit       — vitest run (pure utility functions, no network)
##   4. e2e        — Playwright smoke tests (requires a running Next.js server)
##   5. lighthouse — Lighthouse CI (Performance/SEO/Accessibility/Best Practices
##                    ≥ 90 mobile on Landing + Shop + a product page)
##

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "22"
  NEXT_PUBLIC_SITE_URL: "http://localhost:3000"

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Type checking
  # ─────────────────────────────────────────────────────────────────────────────
  type-check:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Lint
  # ─────────────────────────────────────────────────────────────────────────────
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: node_modules/.bin/eslint . --max-warnings=0

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 3: Unit tests (Vitest)
  # ─────────────────────────────────────────────────────────────────────────────
  unit:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 4: E2E smoke tests (Playwright)
  # ─────────────────────────────────────────────────────────────────────────────
  e2e:
    name: E2E Smoke Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [type-check, lint]
    env:
      CI: "true"
      PLAYWRIGHT_BASE_URL: "http://localhost:3000"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (Chromium only)
        run: npx playwright install --with-deps chromium

      - name: Build Next.js (production)
        run: npm run build

      - name: Start Next.js server
        run: npm run start &

      - name: Wait for server to be ready
        run: |
          echo "Waiting for Next.js server..."
          timeout 60 bash -c 'until curl -sf http://localhost:3000/; do sleep 2; done'
          echo "Server is ready"

      - name: Run Playwright smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Playwright results (screenshots, traces)
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: playwright-results/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 5: Lighthouse CI (Performance, SEO, Accessibility, Best Practices)
  # ─────────────────────────────────────────────────────────────────────────────
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: [type-check, lint]
    env:
      CI: "true"
      LHCI_BASE_URL: "http://localhost:3000"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js (production)
        run: npm run build

      - name: Start Next.js server
        run: npm run start &

      - name: Wait for server to be ready
        run: |
          echo "Waiting for Next.js server..."
          timeout 60 bash -c 'until curl -sf http://localhost:3000/; do sleep 2; done'
          echo "Server is ready"

      - name: Run Lighthouse CI
        run: npm run lighthouse

      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 14
